<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OfflineMindAI</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="new-chat" id="newChat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          New chat
        </button>
      </div>
      <div class="history" id="history"></div>
      <div class="sidebar-bottom">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking Ollama…</span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <select id="modelSelect" aria-label="Model"></select>
      </header>

      <section class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h1>OfflineMind</h1>    
            <div class="logo-lg">AI</div>
      
          <h3>What can I help with?</h3>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <div class="composer-inner">
          <div class="doc-row" id="docRow" hidden>
            <div class="doc-chip">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
              <span id="docName"></span>
              <button class="chip-x" id="docRemove" aria-label="Remove file">✕</button>
            </div>
            <button class="pill" id="summarizeBtn">Summarize</button>
            <button class="pill" id="examBtn">Generate exam</button>
          </div>
          <div class="composer">
            <button class="icon-btn" id="attachBtn" aria-label="Upload file" title="Upload file">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Message OfflineMindAI"></textarea>
            <button class="send" id="sendBtn" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <p class="disclaimer">OfflineMindAI runs locally and can make mistakes. Check important information.</p>
        </div>
      </footer>
    </main>
  </div>

  <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv,.json,.py,.js,.html,.log" hidden />

  <div class="modal" id="examModal" hidden>
    <div class="modal-card">
      <h2>Generate exam</h2>
      <label>Number of questions
        <input type="number" id="examCount" min="1" max="100" value="10" />
      </label>
      <label>Question type
        <select id="examType">
          <option value="mcq">Multiple choice</option>
          <option value="truefalse">True / False</option>
          <option value="short">Short answer</option>
          <option value="mixed">Mixed</option>
          <option value="fill">Fill-in-the-Blank Question</option>
        </select>
      </label>
      <label>Difficulty
        <select id="examDifficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" id="examCancel">Cancel</button>
        <button class="btn-primary" id="examGo">Generate</button>
      </div>
    </div>
  </div>

  <div class="modal" id="sumModal" hidden>
    <div class="modal-card">
      <h2>Summarize</h2>
      <label>Length
        <select id="sumStyle">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="detailed">Detailed</option>
        </select>
      </label>
      <div class="modal-actions">
        <button class="btn-ghost" id="sumCancel">Cancel</button>
        <button class="btn-primary" id="sumGo">Summarize</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="script.js"></script>
</body>
</html>
